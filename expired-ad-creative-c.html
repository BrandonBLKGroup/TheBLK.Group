<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expired Listing Ad - Creative C</title>
<style>
  body {margin: 0; padding: 20px; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh;}
  .ad-container {width: 1080px; height: 1080px; position: relative; background: #0a0a0a; overflow: hidden;}
  
  .bg-home {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect fill="%23333" width="1080" height="1080"/><text x="540" y="540" font-size="48" fill="%23666" text-anchor="middle" font-family="Arial">REPLACE WITH HOME PHOTO</text></svg>');
    background-size: cover;
    background-position: center;
  }
  
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 70px;
    text-align: center;
  }
  
  .headline {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  .headline span {
    color: #C12026;
  }
  
  .subhead {
    font-family: 'Arial', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: #B8960C;
    margin-bottom: 80px;
    letter-spacing: 1px;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 60px;
  }
  
  .stat {
    background: rgba(184, 150, 12, 0.1);
    border: 3px solid #B8960C;
    padding: 35px 20px;
  }
  
  .stat-number {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 72px;
    font-weight: 900;
    color: #B8960C;
    line-height: 1;
    margin-bottom: 12px;
  }
  
  .stat-label {
    font-family: 'Arial', sans-serif;
    font-size: 20px;
    color: #fff;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 1px;
  }
  
  .strategy-box {
    background: #B8960C;
    color: #000;
    padding: 25px;
    margin-bottom: 60px;
  }
  
  .strategy-text {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
  }
  
  .bottom {
    margin-top: auto;
  }
  
  .brand {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #fff;
    margin-bottom: 40px;
  }
  
  .brand span {
    color: #B8960C;
  }
  
  .cta {
    display: inline-block;
    background: #B8960C;
    color: #000;
    font-family: 'Arial', sans-serif;
    font-size: 32px;
    font-weight: 700;
    padding: 20px 60px;
    text-decoration: none;
    letter-spacing: 1px;
  }
  
  .download-btn {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    background: #B8960C;
    color: #000;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div>
  <div class="ad-container" id="ad">
    <div class="bg-home"></div>
    <div class="content">
      <div>
        <div class="headline"><span>EXPIRED?</span><br>LET'S FIX THAT.</div>
        <div class="subhead">The #1 Team for Homes Sold</div>
        
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-number">120</div>
            <div class="stat-label">FAMILIES HELPED<br>IN 2025</div>
          </div>
          <div class="stat">
            <div class="stat-number">TOP 0.1%</div>
            <div class="stat-label">OF REALTORS<br>NATIONWIDE</div>
          </div>
          <div class="stat">
            <div class="stat-number">~1,000</div>
            <div class="stat-label">HOMES SOLD<br>ALL-TIME</div>
          </div>
          <div class="stat">
            <div class="stat-number">30 DAYS</div>
            <div class="stat-label">FRESH STRATEGY<br>RELAUNCH</div>
          </div>
        </div>
        
        <div class="strategy-box">
          <div class="strategy-text">30-DAY, 3% COMMISSION STRATEGY</div>
        </div>
      </div>
      
      <div class="bottom">
        <div class="brand">THE <span>BLK</span> GROUP</div>
        <div class="cta">GET YOUR RELAUNCH PLAN →</div>
      </div>
    </div>
  </div>
  
  <button class="download-btn" onclick="downloadImage()">DOWNLOAD 1080x1080</button>
</div>

<script>
function downloadImage() {
  alert('Right-click the image above and select "Save Image As..." to download.\n\nOr take a screenshot:\nMac: Cmd+Shift+4\nWindows: Win+Shift+S');
}
</script>

</body>
</html>
